<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>RealityCheck – Interactive Country Comparison</title>
  
  <link rel="stylesheet" href="style.css" />
  
  <!-- 🖼️ Favicon & App Icons -->
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png">
  <link rel="apple-touch-icon" href="favicon-180.png">
  <link rel="shortcut icon" href="favicon-32.png" type="image/png">
  
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      display: block;
      min-height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      background: #fdfdfd;
      overscroll-behavior: none;
      -webkit-overflow-scrolling: touch;
    }

    main {
      display: block;
      width: 100%;
      box-sizing: border-box;
    }

    /* iframe ohne eigenes Scrollen, Höhe per JS */
    #main-frame {
      display: block;
      width: 100%;
      border: none;
      height: auto;
      min-height: 60vh;
      overflow: hidden;
    }

    footer {
      position: relative;
      bottom: auto;
      margin-top: 2rem;
    }
  </style>
</head>

<body>
  <header>
    <a href="#" id="logo-link" onclick="loadPage('countries.html', this)">
      <img id="logo" src="images/logo.png" alt="RealityCheck Logo" />
      <span id="logo-text">RealityCheck</span>
    </a>

    <nav>
      <a href="#" onclick="loadPage('countries.html', this)" class="active">Countries</a>
      <a href="#" onclick="loadPage('world.html', this)">World</a>
      <a href="#" onclick="loadPage('overall_ranking_countries.html', this)">Overall Ranking</a>
      <a href="#" onclick="loadPage('analysis.html', this)">Analysis</a>
    </nav>
  </header>

  <main>
    <div id="frame-loader" class="active"><div class="frame-spinner"></div></div>
    <iframe id="main-frame" src="countries.html" title="RealityCheck Content"></iframe>
  </main>

  <footer>
    <div id="tracking-wrapper">
      <div id="total-visitors">Visitors: loading…</div>
    </div>
    <p style="margin-top:.6rem;">
      © RealityCheck Project —
      <a href="#" onclick="loadPage('impressum.html', null)">Impressum</a> |
      <a href="#" onclick="loadPage('privacy.html', null)">Privacy</a> |
      <a href="#" onclick="loadPage('data_glossary.html', null)">Data Glossary</a> |
      <a href="#" onclick="loadPage('about.html', null)">About</a>
    </p>
  </footer>

  <script>
    function loadPage(page, link) {
      const frame = document.getElementById("main-frame");
      const loader = document.getElementById("frame-loader");

      if (frame.src.includes(page)) return;
      frame.src = page + "?t=" + Date.now();
      loader.classList.add("active");
      document.querySelectorAll("nav a").forEach(a => a.classList.remove("active"));
      if (link) link.classList.add("active");
    }

    const frame = document.getElementById("main-frame");
    frame.addEventListener("load", () => {
      document.getElementById("frame-loader").classList.remove("active");
    });

    async function loadVisitorStats() {
      const el = document.getElementById("total-visitors");
      if (!el) return;
      try {
        const resp = await fetch("tracking.json?nocache=" + Date.now());
        const data = await resp.json();
        el.textContent = "Visitors total: " + (data.total || 0);
      } catch {
        el.textContent = "Visitors total: unavailable";
      }
    }
    loadVisitorStats();
  </script>

  <!-- ============================================================
       🩵 FIXED: Stable iframe auto-resize (no endless growth)
       ============================================================ -->
  <script>
    function resizeFrame() {
      const frame = document.getElementById('main-frame');
      if (!frame) return;

      try {
        const doc = frame.contentDocument || frame.contentWindow?.document;
        if (!doc) return;

        // 🔧 Reset problematische 100%-Höhen in der eingebetteten Seite
        doc.documentElement.style.height = 'auto';
        doc.body.style.height = 'auto';
        doc.documentElement.style.minHeight = '0';
        doc.body.style.minHeight = '0';

        // Keine inneren Scrollleisten
        doc.documentElement.style.overflow = 'visible';
        doc.body.style.overflow = 'visible';

        // Höhe sicher bestimmen
        const rect = doc.body.getBoundingClientRect();
        const newHeight = Math.ceil(rect.height) + 1; // 1px Puffer

        const current = parseInt(frame.style.height || '0', 10);
        if (Math.abs(newHeight - current) > 2) {
          frame.style.height = newHeight + 'px';
        }
      } catch (e) {
        console.debug('resizeFrame skipped:', e);
      }
    }

    function attachAutoResize() {
      const frame = document.getElementById('main-frame');
      if (!frame) return;

      frame.setAttribute('scrolling', 'no');
      frame.style.overflow = 'hidden';

      frame.addEventListener('load', () => {
        resizeFrame();

        try {
          const doc = frame.contentDocument || frame.contentWindow?.document;
          if (!doc) return;

          // 🧩 BODY beobachten statt documentElement
          const target = doc.body || doc.documentElement;
          const observer = new ResizeObserver(() => resizeFrame());
          observer.observe(target);

          // Fallback: ein paar Nachmessungen kurz nach dem Load
          let tries = 0;
          const interval = setInterval(() => {
            resizeFrame();
            if (++tries > 8) clearInterval(interval);
          }, 120);
        } catch (e) {
          console.debug('observer skipped:', e);
        }
      });

      window.addEventListener('resize', resizeFrame);
    }

    attachAutoResize();
  </script>
  
  <!-- 🔼 Scroll-to-Top Button -->
  <button id="scroll-top-btn" title="on top">↑</button>

	<script>
	const scrollBtn = document.getElementById("scroll-top-btn");

	if (scrollBtn) {
		console.log("✅ scroll-top-btn gefunden");

		// === Klick-Event: sanft nach oben scrollen ===
		scrollBtn.addEventListener("click", () => {
			console.log("⬆️ Scroll to top clicked");

			const frame = document.getElementById("main-frame");
			if (!frame) return;

			try {
				// Versuche, im iframe nach oben zu scrollen
				const innerWindow = frame.contentWindow;
				if (innerWindow && innerWindow.scrollTo) {
					innerWindow.scrollTo({ top: 0, behavior: "smooth" });
					console.log("↕️ Scrolled inside iframe");
				} else {
					window.scrollTo({ top: 0, behavior: "smooth" });
					console.log("↕️ Fallback scroll (outer window)");
				}
			} catch (err) {
				console.warn("⚠️ Scroll inside iframe failed:", err);
				window.scrollTo({ top: 0, behavior: "smooth" });
			}
		});

		// === Sichtbarkeit steuern (Scroll in Hauptseite, nicht im iframe) ===
		window.addEventListener("scroll", () => {
			const y = window.scrollY;
			scrollBtn.style.opacity = y > 200 ? "1" : "0";
		});
  
	} else {
		console.warn("❌ scroll-top-btn nicht gefunden");
	}
	</script>

</body>

</html>
