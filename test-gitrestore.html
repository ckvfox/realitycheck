<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RealityCheck - Git Restore Test</title>
    <meta name="rc-build-version" content="2025-10-24">
    <link rel="stylesheet" href="style.css?v=20251117-1255-fix" />
</head>
<body class="countries-page">
    <!-- Header wird dynamisch geladen -->
    <header id="header-placeholder"></header>
    
    <div class="main-container">
        <div class="controls-container">
            <div class="dropdown-controls">
                <div class="select-wrapper">
                    <select id="kpiSelect">
                        <option value="">Lädt KPIs...</option>
                    </select>
                </div>
                <div class="select-wrapper">
                    <select id="yearSelect">
                        <option value="">Jahr wählen...</option>
                    </select>
                </div>
                <div class="select-wrapper">
                    <select id="relationSelect">
                        <option value="exact">Genaue Werte</option>
                        <option value="percapita">Pro Kopf</option>
                        <option value="pergdp">Pro BIP</option>
                        <option value="perkm2">Pro km²</option>
                    </select>
                </div>
            </div>
        </div>
        
        <div class="content-grid">
            <div class="map-section">
                <div id="map"></div>
            </div>
            
            <div class="table-section">
                <table id="countryTable">
                    <thead>
                        <tr>
                            <th>Land</th>
                            <th>Wert</th>
                            <th>Trend</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr><td colspan="3">Daten werden geladen...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Footer wird dynamisch geladen -->
    <footer id="footer-placeholder"></footer>

    <!-- Scripts - Git wiederhergestellte Version -->
    <script src="scripts/utils_ui.js?v=20251117-1425-gitrestore" defer></script>
    <script src="scripts/core.js?v=20251117-1425-gitrestore" defer></script>
    <script src="scripts/script.js?v=20251117-1425-gitrestore" defer></script>
    
    <script>
        // Debug Output für Visual Feedback
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🔍 Test-GitRestore: DOM loaded');
            
            // Status Output nach 3 Sekunden
            setTimeout(() => {
                const kpiSelect = document.getElementById('kpiSelect');
                const yearSelect = document.getElementById('yearSelect');
                const map = document.getElementById('map');
                
                console.log('📊 KPI Select options:', kpiSelect?.options?.length || 'not found');
                console.log('📅 Year Select options:', yearSelect?.options?.length || 'not found');
                console.log('🗺️ Map element:', map ? 'found' : 'not found');
                
                // Visual Output im Browser
                document.body.insertAdjacentHTML('beforeend', `
                    <div style="position: fixed; top: 10px; right: 10px; background: rgba(0,0,0,0.8); color: white; padding: 10px; border-radius: 5px; font-family: monospace; z-index: 9999;">
                        <div>KPI Options: ${kpiSelect?.options?.length || 'FEHLER'}</div>
                        <div>Year Options: ${yearSelect?.options?.length || 'FEHLER'}</div>
                        <div>Map: ${map ? 'OK' : 'FEHLER'}</div>
                    </div>
                `);
            }, 3000);
        });
    </script>
</body>
</html>
