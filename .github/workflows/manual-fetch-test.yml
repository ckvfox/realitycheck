name: 🧪 RealityCheck – Manual Fetch Test

on:
  workflow_dispatch: {}    # Nur manuell startbar

concurrency:
  group: realitycheck-data-pipeline
  cancel-in-progress: false

jobs:
  manual_test_run:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      TZ: Europe/Berlin

    steps:
      - name: 🧭 Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          echo "✅ Dependencies installed"

      - name: 🧪 Run RealityCheck pipeline in TEST mode
        run: |
          echo "===== RealityCheck Manual Fetch Test Start $(date -u) ====="
          echo "🧪 TEST MODE: Fetching data to test configuration"
          python ./scripts/fetch_data.py --test
          echo "===== Manual Fetch Test End $(date -u) ====="

      - name: 💾 Upload log artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fetch_log_test
          path: data/fetch_log.txt
          retention-days: 7

      - name: 📋 Verify fetch_status.json
        run: |
          echo "=== Fetch Status ==="
          cat data/fetch_status.json | head -50

      - name: 🕐 Get current UTC date
        id: date
        run: echo "date=$(date -u '+%a, %d %b %Y %H:%M:%S UTC')" >> $GITHUB_OUTPUT

      - name: 📱 Create GitHub Issue for status
        if: always()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const title = `🧪 Manual Test RealityCheck Run – ${{ job.status }}`;
            const body = `
            🧭 **Manual Test RealityCheck fetch completed**
            
            - **Status**: ${{ job.status }}
            - **Mode**: TEST – Data fetched to verify configuration
            - **Date**: ${{ steps.date.outputs.date }}
            - **Run**: [View full log](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            
            **Note**: This is a test run. Results are not deployed to production.
            
            ---
            *This issue was created automatically by the RealityCheck Bot.*
            `;
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['automation', 'test']
            });
