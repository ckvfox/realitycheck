name: RealityCheck Auto Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: Upload all productive files again
        type: boolean
        default: false

permissions:
  contents: read

# Share the monthly/manual-fetch lock; uploads cannot overlap a data refresh.
concurrency:
  group: realitycheck-data-pipeline
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout latest main after acquiring the production lock
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install pinned test dependencies
        run: python -m pip install --disable-pip-version-check --requirement requirements.txt

      - name: Test the exact production snapshot
        run: |
          python scripts/run_tests.py
          python .github/scripts/fpf_project_compliance.py . --profile apache-shared-hosting --production

      - name: Prepare productive allowlist
        id: package
        run: |
          python scripts/prepare_deployment.py --mode full
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Upload changed files to verified webroot (FTPS, no deletes)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          DEPLOY_COMMIT: ${{ steps.package.outputs.commit }}
          FORCE_UPLOAD: ${{ inputs.force == true && 'true' || 'false' }}
        run: |
          args=()
          if [ "$FORCE_UPLOAD" = "true" ]; then args+=(--force); fi
          python scripts/deploy_ftps.py --commit "$DEPLOY_COMMIT" "${args[@]}"

      - name: Record deployment result
        if: always()
        env:
          DEPLOY_COMMIT: ${{ steps.package.outputs.commit }}
          DEPLOY_STATUS: ${{ job.status }}
        run: |
          {
            echo "### Automatic FTPS deployment"
            echo "Status: $DEPLOY_STATUS"
            echo "Commit tested and packaged: $DEPLOY_COMMIT"
            echo "Destination: /realitycheck.great-site.net/htdocs"
            echo "No remote files are deleted."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save secret-free deployment receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ftps-deployment-${{ github.run_id }}
          path: build/deployment/auto-deploy-receipt.json
          if-no-files-found: ignore
          retention-days: 30
