name: 🎯 RealityCheck – Partial FTP Upload (Safe Mode)

on:
  workflow_dispatch:
    inputs:
      files:
        description: "Comma-separated productive files (e.g. 'germany-dossier.php,data/kpi_analysis.json')"
        required: true
        default: "data/kpi_analysis.json"

concurrency:
  group: realitycheck-data-pipeline
  cancel-in-progress: false

jobs:
  ftp_partial:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      TZ: Europe/Berlin

    steps:
      - name: 🧭 Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Validate and build productive allowlist
        run: |
          python scripts/validation.py
          python scripts/prepare_deployment.py --mode full

      - name: Upload selected allowlisted files (FTPS, no deletes)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FILES_INPUT: ${{ inputs.files }}
        run: python scripts/deploy_ftps.py --files "$FILES_INPUT" --commit "$(git rev-parse HEAD)"

      - name: 🕐 Get current UTC date
        id: date
        run: echo "date=$(date -u '+%a, %d %b %Y %H:%M:%S UTC')" >> $GITHUB_OUTPUT

      - name: 📱 Create GitHub Issue for status
        if: always()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          FILES_INPUT: ${{ inputs.files }}
        with:
          script: |
            const requestedFiles = process.env.FILES_INPUT || '(none)';
            const title = `🎯 Partial FTP Upload – ${{ job.status }}`;
            const body = `
            🧭 **Partial FTP upload completed**
            
            - **Status**: ${{ job.status }}
            - **Date**: ${{ steps.date.outputs.date }}
            - **Files**: \`${requestedFiles}\`
            - **Mode**: Safe incremental (no deletions)
            - **Run**: [View full log](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            
            ---
            *This issue was created automatically by the RealityCheck Bot.*
            `;
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['automation', 'ftp-upload', 'partial-upload']
            });
