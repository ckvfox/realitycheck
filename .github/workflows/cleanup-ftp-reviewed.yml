name: Reviewed FTP cleanup 2026-10-30

on:
  workflow_dispatch:
    inputs:
      stage:
        type: choice
        options: [backup, delete]
        default: backup
        required: true

permissions:
  contents: read

concurrency:
  group: realitycheck-data-pipeline
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Test cleanup safeguards
        run: python -m unittest discover -s tests -p test_ftp_cleanup.py
      - name: Execute approved stage
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          CLEANUP_STAGE: ${{ inputs.stage }}
        run: python scripts/cleanup_ftp_reviewed.py "$CLEANUP_STAGE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ftp-cleanup-${{ inputs.stage }}-${{ github.run_id }}
          path: build/source-review/ftp-cleanup-receipt.json
          if-no-files-found: ignore
          retention-days: 30
