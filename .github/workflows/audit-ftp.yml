name: Read-only FTP inventory

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: realitycheck-data-pipeline
  cancel-in-progress: false

jobs:
  inventory:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Test read-only audit boundaries
        run: python -m unittest discover -s tests -p test_ftp_inventory.py
      - name: List metadata in both authorized webroots
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python scripts/audit_ftp_inventory.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ftp-sites-inventory-${{ github.run_id }}
          path: build/source-review/ftp-sites-inventory.json
          retention-days: 7
