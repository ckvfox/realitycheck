name: 🚀 RealityCheck – Full FTP Upload

on:
  workflow_dispatch: {}

jobs:
  ftp_full:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      TZ: Europe/Berlin
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: FTP Upload (Full Production)
        uses: SamKirkland/ftp-deploy-action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./
          server-dir: ${{ secrets.FTP_DIR }}/
          dangerous-clean-slate: true
          state-name: .ftp-deploy-sync-state-full.json
          log-level: verbose
          exclude: |
            **/.git*
            **/.github/
            **/ai_workspace/
            **/bak/
            **/__pycache__/
            **/*.py
            **/*.md
            **/*.yml
            **/*.csv
            **/*.txt
            **/FEATURES_IMPLEMENTED.md
            **/FIXES_IMPLEMENTED.md
            **/README.md
            **/CONTRIBUTING.md
            **/CODE_OF_CONDUCT.md
            **/SECURITY.md
            **/licence
            **/tracking.json
            **/.env
            **/.gitignore

      - name: 🕐 Get current UTC date
        id: date
        run: echo "date=$(date -u '+%a, %d %b %Y %H:%M:%S UTC')" >> $GITHUB_OUTPUT

      - name: 📱 Create GitHub Issue for status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `🚀 Full FTP Upload – ${{ job.status }}`;
            const body = `
            🚀 **Full production deployment completed**
            
            - **Status**: ${{ job.status }}
            - **Date**: ${{ steps.date.outputs.date }}
            - **Mode**: Complete frontend + data upload (production-ready files only)
            - **Deployed**: HTML, CSS, JS, JSON data, images, robots.txt, sitemap.xml
            - **Excluded**: Python scripts, markdown docs, CSV sources, GitHub files
            - **Run**: [View full log](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            
            ---
            *This issue was created automatically by the RealityCheck Bot.*
            `;
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['automation', 'ftp-upload', 'full-upload']
            });
