name: 🚀 RealityCheck – Full FTP Upload

on:
  workflow_dispatch: {}

concurrency:
  group: realitycheck-production-deploy
  cancel-in-progress: false

jobs:
  ftp_full:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      TZ: Europe/Berlin

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Validate and prepare allowlisted production package
        run: |
          python scripts/validation.py
          python scripts/prepare_deployment.py --mode full

      - name: FTP Upload (validated production package)
        uses: SamKirkland/ftp-deploy-action@8e83cea8672e3fbcbb9fdafff34debf6ae4c5f65 # v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: build/deployment/full/
          server-dir: ${{ secrets.FTP_DIR }}/
          dangerous-clean-slate: false
          state-name: .ftp-deploy-sync-state-full.json
          log-level: verbose

      - name: 🕐 Get current UTC date
        id: date
        run: echo "date=$(date -u '+%a, %d %b %Y %H:%M:%S UTC')" >> $GITHUB_OUTPUT

      - name: 📱 Create GitHub Issue for status
        if: always()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const title = `🚀 Full FTP Upload – ${{ job.status }}`;
            const body = `
            🚀 **Full production deployment completed**
            
            - **Status**: ${{ job.status }}
            - **Date**: ${{ steps.date.outputs.date }}
            - **Mode**: Complete frontend + data upload (production-ready files only)
            - **Deployed**: HTML, CSS, JS, JSON data, images, robots.txt, sitemap.xml
            - **Excluded**: Python scripts, markdown docs, CSV sources, GitHub files
            - **Run**: [View full log](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            
            ---
            *This issue was created automatically by the RealityCheck Bot.*
            `;
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['automation', 'ftp-upload', 'full-upload']
            });
