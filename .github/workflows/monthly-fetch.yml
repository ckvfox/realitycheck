name: 📅 RealityCheck – Monthly Automated Fetch (Safe)

on:
  schedule:
    - cron: "0 3 1 * *"     # Jeden 1. des Monats um 03:00 UTC (05:00 MEZ)
  workflow_dispatch: {}      # Optional: manuell startbar

concurrency:
  group: realitycheck-data-pipeline
  cancel-in-progress: false

jobs:
  monthly_run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    env:
      TZ: Europe/Berlin
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - name: 🧭 Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          echo "✅ Dependencies installed"

      - name: 🚀 Run full RealityCheck pipeline
        run: |
          echo "===== RealityCheck Monthly Fetch Start $(date -u) ====="
          python ./scripts/fetch_data.py
          echo "===== Monthly Fetch End $(date -u) ====="

      - name: 💾 Upload log artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fetch_log_monthly
          path: data/fetch_log.txt
          retention-days: 7

      - name: 🌍 FTP Deploy /data to InfinityFree (Safe)
        uses: SamKirkland/ftp-deploy-action@8e83cea8672e3fbcbb9fdafff34debf6ae4c5f65 # v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: data/
          server-dir: ${{ secrets.FTP_DIR }}/data/
          state-name: .ftp-deploy-sync-data.json
          log-level: verbose
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.github*
            **/__pycache__/
            **/*.py
            **/*.md
            **/*.yml
            **/*.csv
            **/pending/**

      - name: 🪶 Commit and push updated data to GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "RealityCheck Bot"
          git config --global user.email "bot@realitycheck"
          git add data/
          # Nur committen, wenn es Änderungen gibt
          git diff-index --quiet HEAD || git commit -m "📆 Monthly data update ($(date -u))"
          git push origin HEAD:main

      # ✅ Neuer, stabiler Schritt: Datum in Variable schreiben
      - name: 🕐 Get current UTC date
        id: date
        run: echo "date=$(date -u '+%a, %d %b %Y %H:%M:%S UTC')" >> $GITHUB_OUTPUT

      - name: 📱 Create GitHub Issue for status
        if: always()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const title = `📅 Monthly RealityCheck Run – ${{ job.status }}`;
            const body = `
            🧭 **Monthly RealityCheck workflow completed**
            
            - **Status**: ${{ job.status }}
            - **Date**: ${{ steps.date.outputs.date }}
            - **Run**: [View full log](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            
            ---
            *This issue was created automatically by the RealityCheck Bot.*
            `;
            
            // Create issue
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['automation', 'monthly-run']
            });
