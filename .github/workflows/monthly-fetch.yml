name: 📅 RealityCheck – Monthly Automated Fetch (Safe)

on:
  schedule:
    - cron: "0 3 1 * *"     # Jeden 1. des Monats um 03:00 UTC
  workflow_dispatch: {}      # Optional: manuell startbar

concurrency:
  group: realitycheck-data-pipeline
  cancel-in-progress: false

jobs:
  monthly_run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    env:
      TZ: Europe/Berlin
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - name: 🧭 Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          echo "✅ Dependencies installed"

      - name: 🚀 Run full RealityCheck pipeline
        run: |
          set -o pipefail
          echo "===== RealityCheck Monthly Fetch Start $(date -u) ====="
          python ./scripts/fetch_data.py 2>&1 | tee data/workflow_fetch_console.log
          echo "===== Monthly Fetch End $(date -u) ====="

      - name: 🔎 Check maintained CSV release pages
        run: |
          set -o pipefail
          python ./scripts/check_source_csv_updates.py --online 2>&1 | tee -a data/workflow_fetch_console.log

      - name: Prepare allowlisted production package
        run: python scripts/prepare_deployment.py --mode full

      - name: Upload validated package (FTPS, no deletes)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python scripts/deploy_ftps.py --scope data --commit "$(git rev-parse HEAD)"

      - name: 🪶 Commit and push updated data to GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "RealityCheck Bot"
          git config --global user.email "bot@realitycheck"
          git add data/
          # Nur committen, wenn es Änderungen gibt
          git diff-index --quiet HEAD || git commit -m "📆 Monthly data update ($(date -u))"
          git push origin HEAD:main

      # ✅ Neuer, stabiler Schritt: Datum in Variable schreiben
      - name: 🕐 Get current UTC date
        if: always()
        id: date
        run: echo "date=$(date -u '+%a, %d %b %Y %H:%M:%S UTC')" >> $GITHUB_OUTPUT

      - name: 📋 Write actionable fetch summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python scripts/write_fetch_summary.py \
            --job-status "$JOB_STATUS" \
            --run-url "$RUN_URL" \
            --output data/workflow_fetch_summary.md
          cat data/workflow_fetch_summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: 💾 Upload fetch diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: realitycheck-fetch-diagnostics-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            data/workflow_fetch_summary.md
            data/workflow_fetch_console.log
            data/fetch_log.txt
            data/fetch_status.json
            data/fetch_state.json
            data/validation_log.txt
            data/manual_source_status.json

      # Keep one durable record per run; only unresolved failures stay open.
      - name: 📱 Document run and reconcile monthly status issues
        if: always()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          RUN_STATUS: ${{ job.status }}
          RUN_DATE: ${{ steps.date.outputs.date }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        with:
          script: |
            const repo = context.repo;
            // A manually dispatched feature-branch run cannot resolve production failures.
            if (context.ref !== `refs/heads/${process.env.DEFAULT_BRANCH}`) {
              core.notice('Status issues are managed only for the default branch. See the run summary.');
              return;
            }
            const status = process.env.RUN_STATUS;
            if (!['success', 'failure', 'cancelled'].includes(status)) {
              throw new Error(`Unexpected run status: ${status}`);
            }
            const runId = String(context.runId);
            const attempt = process.env.GITHUB_RUN_ATTEMPT || '1';
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${repo.owner}/${repo.repo}/actions/runs/${runId}`;
            const marker = `<!-- realitycheck-monthly-status:${runId} -->`;
            const attemptMarker = `<!-- realitycheck-monthly-attempt:${runId}:${attempt} -->`;
            const title = `📅 Monthly RealityCheck Run – ${status}`;
            const body = [
              marker, attemptMarker,
              '🧭 **Monthly RealityCheck workflow completed**', '',
              `- **Status**: ${status}`,
              `- **Date**: ${process.env.RUN_DATE || new Date().toISOString()}`,
              `- **Branch**: ${process.env.DEFAULT_BRANCH}`,
              `- **Attempt**: ${attempt}`,
              `- **Run**: [View full log](${runUrl}/attempts/${attempt})`,
              `- **Diagnostics**: Download artifact 'realitycheck-fetch-diagnostics-${runId}' from the run page (30-day retention)`,
              '', 'A workflow success records pipeline completion; it does not certify every source is current.',
              '', '*This issue was created automatically by the RealityCheck Bot.*'
            ].join('\n');
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              ...repo, state: 'all', labels: 'automation,monthly-run', per_page: 100
            });
            const managed = issue => !issue.pull_request &&
              issue.user?.login === 'github-actions[bot]' &&
              /^📅 Monthly RealityCheck Run – (success|failure|cancelled)$/.test(issue.title) &&
              /^<!-- realitycheck-monthly-status:\d+ -->\n/.test(issue.body || '');
            let current = issues.find(issue => managed(issue) && issue.body.startsWith(marker + '\n'));
            const state = status === 'success' ? 'closed' : 'open';
            if (current) {
              const currentComments = await github.paginate(github.rest.issues.listComments, {
                ...repo, issue_number: current.number, per_page: 100
              });
              // A record adopted as a human task must retain its state and body.
              if (current.assignees?.length || current.milestone ||
                  currentComments.some(comment => comment.user?.login !== 'github-actions[bot]')) {
                if (!currentComments.some(comment => comment.body?.includes(attemptMarker))) {
                  await github.rest.issues.createComment({
                    ...repo, issue_number: current.number, body
                  });
                }
                core.notice(`Preserving #${current.number}: human-owned task requires review.`);
                return;
              }
              // Preserve the previous attempt before replacing the current snapshot.
              if (!current.body.includes(attemptMarker)) {
                const comments = currentComments;
                const previousMarker = current.body.match(/<!-- realitycheck-monthly-attempt:\d+:\d+ -->/)?.[0];
                if (previousMarker && !comments.some(comment => comment.body?.includes(previousMarker))) {
                  await github.rest.issues.createComment({
                    ...repo, issue_number: current.number,
                    body: `Previous attempt (preserved before rerun):\n\n${current.body}`
                  });
                }
              }
              await github.rest.issues.update({
                ...repo, issue_number: current.number, title, body, state,
                state_reason: state === 'closed' ? 'completed' : 'reopened'
              });
            } else {
              const result = await github.rest.issues.create({
                ...repo, title, body, labels: ['automation', 'monthly-run']
              });
              current = result.data;
              if (state === 'closed') {
                await github.rest.issues.update({
                  ...repo, issue_number: current.number, state: 'closed', state_reason: 'completed'
                });
              }
            }
            if (status !== 'success') return;
            for (const issue of issues) {
              if (!managed(issue) || issue.state !== 'open' || issue.number === current.number ||
                  issue.assignees?.length || issue.milestone ||
                  !issue.body.includes(`- **Branch**: ${process.env.DEFAULT_BRANCH}\n`)) continue;
              const previousRun = issue.body.match(/^<!-- realitycheck-monthly-status:(\d+) -->/)[1];
              // An older run/attempt must never close a newer failure.
              if (BigInt(previousRun) >= BigInt(runId)) continue;
              const comments = await github.paginate(github.rest.issues.listComments, {
                ...repo, issue_number: issue.number, per_page: 100
              });
              if (comments.some(comment => comment.user?.login !== 'github-actions[bot]')) {
                core.notice(`Preserving #${issue.number}: human discussion requires review.`);
                continue;
              }
              const recoveryMarker = `<!-- realitycheck-monthly-recovery:${runId} -->`;
              if (!comments.some(comment => comment.body?.includes(recoveryMarker))) {
                await github.rest.issues.createComment({
                  ...repo, issue_number: issue.number,
                  body: `${recoveryMarker}\nSuperseded by successful default-branch monthly run [${runId}](${runUrl}) (status record #${current.number}). This closes the historical run notification, not independently tracked data-quality or development tasks.`
                });
              }
              await github.rest.issues.update({
                ...repo, issue_number: issue.number, state: 'closed', state_reason: 'completed'
              });
            }
