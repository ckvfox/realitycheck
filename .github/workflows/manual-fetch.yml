name: 🧪 RealityCheck – Manual Fetch (Data)

on:
  workflow_dispatch: {}    # Nur manuell startbar

concurrency:
  group: realitycheck-data-pipeline
  cancel-in-progress: false

jobs:
  manual_run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    env:
      TZ: Europe/Berlin
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - name: 🧭 Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          echo "✅ Dependencies installed"

      - name: 🚀 Run full RealityCheck pipeline
        run: |
          echo "===== RealityCheck Manual Fetch Start $(date -u) ====="
          python ./scripts/fetch_data.py
          echo "===== Manual Fetch End $(date -u) ====="

      - name: 💾 Upload log artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fetch_log_manual
          path: data/fetch_log.txt
          retention-days: 7

      - name: Prepare allowlisted production package
        run: python scripts/prepare_deployment.py --mode full

      - name: Upload validated package (FTPS, no deletes)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python scripts/deploy_ftps.py --scope data --commit "$(git rev-parse HEAD)"

      - name: 🪶 Commit and push updated data to GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "RealityCheck Bot"
          git config --global user.email "bot@realitycheck"
          git add data/
          git commit -m "📊 Manual data update ($(date -u))" || echo "No changes to commit"
          git push origin HEAD:main

      # ✅ Neuer Schritt: aktuelles UTC-Datum speichern
      - name: 🕐 Get current UTC date
        id: date
        run: echo "date=$(date -u '+%a, %d %b %Y %H:%M:%S UTC')" >> $GITHUB_OUTPUT

      - name: 📱 Create GitHub Issue for status
        if: always()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const title = `🧪 Manual RealityCheck Run – ${{ job.status }}`;
            const body = `
            🧭 **Manual RealityCheck fetch completed**
            
            - **Status**: ${{ job.status }}
            - **Date**: ${{ steps.date.outputs.date }}
            - **Run**: [View full log](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            
            ---
            *This issue was created automatically by the RealityCheck Bot.*
            `;
            
            // Create issue
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['automation', 'manual-run']
            });
