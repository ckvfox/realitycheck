name: 🔁 RealityCheck – FTP Sync Upload

on:
  workflow_dispatch: {}

jobs:
  ftp_sync:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      TZ: Europe/Berlin
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: 📄 Prepare sync file list from ftp_data.txt (mit Platzhalter)
        id: filelist
        run: |
          shopt -s globstar nullglob
          mkdir -p ftp_sync_tmp
          while IFS= read -r pattern; do
            for file in $pattern; do
              if [ -f "$file" ]; then
                mkdir -p "ftp_sync_tmp/$(dirname $file)"
                cp "$file" "ftp_sync_tmp/$file"
              fi
            done
          done < ftp_data.txt
          echo "FTP sync file list (mit Platzhalter) vorbereitet."

      - name: FTP Sync (only files from ftp_data.txt)
        uses: SamKirkland/ftp-deploy-action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ftp_sync_tmp/
          server-dir: ${{ secrets.FTP_DIR }}/
          state-name: .ftp-deploy-sync-state-data.json
          log-level: verbose
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.github*
            **/__pycache__/
            **/*.py
            **/*.md
            **/*.yml
            **/*.csv

      - name: 🕐 Get current UTC date
        id: date
        run: echo "date=$(date -u '+%a, %d %b %Y %H:%M:%S UTC')" >> $GITHUB_OUTPUT

      - name: 📱 Create GitHub Issue for status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `🔁 FTP Sync Upload – ${{ job.status }}`;
            const body = `
            🧭 **FTP sync upload completed**
            
            - **Status**: ${{ job.status }}
            - **Date**: ${{ steps.date.outputs.date }}
            - **Mode**: Incremental sync (safe)
            - **Run**: [View full log](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            
            ---
            *This issue was created automatically by the RealityCheck Bot.*
            `;
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['automation', 'ftp-upload', 'sync-upload']
            });
