name: PISA edition review

on:
  workflow_dispatch:
    inputs:
      workbook_url:
        description: Official OECD Annex B1.2a XLSX URL
        required: true
        type: string
      cycle:
        description: PISA cycle year
        required: true
        type: number
      participants:
        description: Reviewed count of eligible participants with all three domains
        required: true
        type: number
      tables:
        description: Exact worksheet names for science, reading and mathematics, separated by |
        default: Table I.B1.2a.36|Table I.B1.2a.37|Table I.B1.2a.38
        type: string

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install openpyxl==3.1.5
      - name: Generate candidate without publishing
        env:
          WORKBOOK_URL: ${{ inputs.workbook_url }}
          PISA_CYCLE: ${{ inputs.cycle }}
          PISA_PARTICIPANTS: ${{ inputs.participants }}
          PISA_TABLES: ${{ inputs.tables }}
        run: |
          [[ "$WORKBOOK_URL" =~ ^https://([a-zA-Z0-9-]+\.)*oecd\.org/ ]] || exit 1
          curl --fail --silent --show-error --location --proto '=https' --max-time 90 "$WORKBOOK_URL" -o "$RUNNER_TEMP/pisa.xlsx"
          IFS='|' read -r -a tables <<< "$PISA_TABLES"
          python scripts/helper/pisa_overall_score.py "$RUNNER_TEMP/pisa.xlsx" "$RUNNER_TEMP/pisa-candidate.csv" \
            --cycle "$PISA_CYCLE" --expected-participants "$PISA_PARTICIPANTS" --tables "${tables[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pisa-review-candidate
          path: |
            ${{ runner.temp }}/pisa-candidate.csv
            ${{ runner.temp }}/pisa.xlsx
