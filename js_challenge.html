<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RealityCheck - Security Check</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Short JavaScript check to protect RealityCheck from automated abuse.">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Segoe UI", Arial, sans-serif;
      background: #f4f7fb;
      color: #1b2f4b;
    }
    main {
      max-width: 560px;
      margin: 2rem;
      padding: 1.5rem;
      border-radius: 12px;
      background: #ffffff;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      text-align: center;
      line-height: 1.5;
    }
    h1 { margin-top: 0; }
    a { color: #1a4b8f; }
  </style>
  <script>
    (function () {
      // Only allow same-site path redirects to prevent open redirect abuse.
      var params = new URLSearchParams(window.location.search);
      var requestedPath = params.get("return") || "/";
      var safePath = requestedPath;

      if (!safePath.startsWith("/") || safePath.startsWith("//")) {
        safePath = "/";
      }

      // JS proof cookie: Apache checks this cookie before serving HTML directly.
      document.cookie = "rc_js_verified=1; Max-Age=1800; Path=/; SameSite=Lax; Secure";
      window.location.replace(safePath);
    })();
  </script>
</head>
<body>
  <main>
    <h1>Security Check in Progress</h1>
    <p>Please wait a moment. You will be redirected automatically.</p>
    <noscript>
      <p>
        JavaScript is required for this anti-abuse check. If this blocks valid indexing,
        allowlist your crawler user-agent in .htaccess.
      </p>
    </noscript>
  </main>
</body>
</html>
