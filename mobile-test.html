<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mobile Test - World Charts</title>
  <style>
    /* Force mobile layout for testing */
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      width: 375px !important; /* iPhone SE width */
      max-width: 375px !important;
      overflow-x: hidden;
    }
    
    .test-frame {
      border: 2px solid #007acc;
      border-radius: 10px;
      padding: 10px;
      background: #f5f5f5;
    }
    
    iframe {
      width: 100%;
      height: 800px;
      border: none;
      border-radius: 5px;
    }
    
    .info {
      background: #007acc;
      color: white;
      padding: 10px;
      border-radius: 5px;
      margin-bottom: 10px;
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="test-frame">
    <div class="info">📱 Mobile Simulation: iPhone SE (375px)</div>
    <iframe src="/world.html?mobile-test=375px" title="Mobile World Page"></iframe>
  </div>
</body>
</html>
