<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Country Matching Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .controls { margin: 20px 0; }
        button { margin: 5px; padding: 10px; }
        #results { 
            border: 1px solid #ccc; 
            padding: 10px; 
            background: #f9f9f9;
            font-family: monospace;
            font-size: 12px;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <h1>🔧 Country Matching Logic Test</h1>
    
    <div class="controls">
        <button onclick="testMatching()">Test Country Matching</button>
        <button onclick="clearResults()">Clear Results</button>
    </div>
    
    <div id="results"></div>

    <script>
        // Simulierte GeoJSON country names (wie sie in der echten Datei stehen)
        const geoJsonCountries = [
            'Germany', 'France', 'Italy', 'Spain', 'Poland', 'Romania', 'Netherlands', 
            'Belgium', 'Greece', 'Portugal', 'Czech Republic', 'Hungary', 'Sweden',
            'Austria', 'Belarus', 'Switzerland', 'Bulgaria', 'Serbia', 'Denmark',
            'Finland', 'Slovakia', 'Norway', 'Ireland', 'Croatia', 'Bosnia and Herzegovina',
            'Albania', 'Lithuania', 'Slovenia', 'Latvia', 'Estonia', 'Moldova',
            'North Macedonia', 'Luxembourg', 'Malta', 'Iceland', 'Montenegro',
            'United States of America', 'Canada', 'United Kingdom of Great Britain and Northern Ireland',
            'Russian Federation', 'Japan', 'Korea, Republic of'
        ];
        
        // Test groups (wie in groups.json)
        const testGroups = {
            EU: ['Austria', 'Belgium', 'Bulgaria', 'Croatia', 'Cyprus', 'Czechia', 'Denmark', 'Estonia', 'Finland', 'France', 'Germany', 'Greece', 'Hungary', 'Ireland', 'Italy', 'Latvia', 'Lithuania', 'Luxembourg', 'Malta', 'Netherlands', 'Poland', 'Portugal', 'Romania', 'Slovakia', 'Slovenia', 'Spain', 'Sweden'],
            G7: ['Canada', 'France', 'Germany', 'Italy', 'Japan', 'United Kingdom', 'United States']
        };
        
        function addResult(message) {
            document.getElementById('results').textContent += message + '\n';
        }
        
        function clearResults() {
            document.getElementById('results').textContent = '';
        }
        
        function matchCountry(geoJsonName, targetCountries) {
            // Advanced country name mappings
            const geoJsonMappings = {
                'United States of America': 'United States',
                'United Kingdom of Great Britain and Northern Ireland': 'United Kingdom', 
                'Russian Federation': 'Russia',
                'Korea, Republic of': 'South Korea',
                'Czech Republic': 'Czechia'
            };
            
            const targetSet = new Set(targetCountries.map(c => c.toLowerCase()));
            const geoNameLower = geoJsonName.toLowerCase();
            
            // Strategy 1: Direct exact match
            if (targetSet.has(geoNameLower)) {
                return { match: true, reason: 'exact', target: geoJsonName };
            }
            
            // Strategy 2: Use mapping table
            const canonicalName = geoJsonMappings[geoJsonName];
            if (canonicalName && targetSet.has(canonicalName.toLowerCase())) {
                return { match: true, reason: 'mapped', target: canonicalName };
            }
            
            // Strategy 3: Intelligent partial matching
            for (let target of targetCountries) {
                const targetLower = target.toLowerCase();
                
                // Target contains in GeoJSON name
                if (targetLower.length > 4 && geoNameLower.includes(targetLower)) {
                    return { match: true, reason: 'contains-target', target: target };
                }
                
                // GeoJSON name contains in target
                if (geoNameLower.length > 4 && targetLower.includes(geoNameLower)) {
                    return { match: true, reason: 'target-contains-geo', target: target };
                }
            }
            
            return { match: false, reason: 'no-match', target: null };
        }
        
        function testMatching() {
            clearResults();
            addResult('🧪 TESTING COUNTRY MATCHING LOGIC\n' + '='.repeat(50) + '\n');
            
            // Test EU matching
            addResult('🇪🇺 TESTING EU COUNTRIES:');
            addResult(`Target: ${testGroups.EU.length} countries`);
            addResult(`Available GeoJSON: ${geoJsonCountries.length} countries\n`);
            
            let euMatches = 0;
            testGroups.EU.forEach(euCountry => {
                let found = false;
                let matchDetails = '';
                
                geoJsonCountries.forEach(geoCountry => {
                    const result = matchCountry(geoCountry, [euCountry]);
                    if (result.match) {
                        found = true;
                        matchDetails = `"${geoCountry}" → "${result.target}" (${result.reason})`;
                        euMatches++;
                    }
                });
                
                if (found) {
                    addResult(`✅ ${euCountry}: ${matchDetails}`);
                } else {
                    addResult(`❌ ${euCountry}: NOT FOUND`);
                }
            });
            
            addResult(`\n📊 EU RESULT: ${euMatches}/${testGroups.EU.length} countries matched\n`);
            
            // Test G7 matching
            addResult('🏛️ TESTING G7 COUNTRIES:');
            let g7Matches = 0;
            testGroups.G7.forEach(g7Country => {
                let found = false;
                let matchDetails = '';
                
                geoJsonCountries.forEach(geoCountry => {
                    const result = matchCountry(geoCountry, [g7Country]);
                    if (result.match) {
                        found = true;
                        matchDetails = `"${geoCountry}" → "${result.target}" (${result.reason})`;
                        g7Matches++;
                    }
                });
                
                if (found) {
                    addResult(`✅ ${g7Country}: ${matchDetails}`);
                } else {
                    addResult(`❌ ${g7Country}: NOT FOUND`);
                }
            });
            
            addResult(`\n📊 G7 RESULT: ${g7Matches}/${testGroups.G7.length} countries matched`);
            
            // Show problematic cases
            addResult('\n🚨 PROBLEMATIC CASES:');
            const problematic = [
                { geo: 'United States of America', target: 'United States' },
                { geo: 'United Kingdom of Great Britain and Northern Ireland', target: 'United Kingdom' },
                { geo: 'Czech Republic', target: 'Czechia' },
                { geo: 'Korea, Republic of', target: 'South Korea' }
            ];
            
            problematic.forEach(case_ => {
                const result = matchCountry(case_.geo, [case_.target]);
                addResult(`${result.match ? '✅' : '❌'} "${case_.geo}" → "${case_.target}" (${result.reason})`);
            });
        }
    </script>
</body>
</html>
